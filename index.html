      });

        try {
          const savedCart = localStorage.getItem(CART_STORAGE_KEY);
          return savedCart ? JSON.parse(savedCart) : [];
        } catch (e) { return []; }

      }, [products]);

      const toggleLanguage = () => {
        setLang(prev => prev === 'zh-TW' ? 'vi' : 'zh-TW');
      };

      const filteredProducts = useMemo(() => {
        return products.filter(product => {
          const matchesCategory = selectedCategory === 'all' || product.category === selectedCategory;
          const name = lang === 'zh-TW' ? product.nameZh : product.nameVi;
          const matchesSearch = name.toLowerCase().includes(searchQuery.toLowerCase());
          return matchesCategory && matchesSearch;
        });
      }, [products, selectedCategory, searchQuery, lang]);

      const handleAddToCart = (productToAdd) => {
        setCart(prev => {
          const cartKey = `${productToAdd.id}-${productToAdd.grind || 'default'}`;
          const existing = prev.find(item => item.cartKey === cartKey);
          if (existing) {
            return prev.map(item => item.cartKey === cartKey ? { ...item, quantity: item.quantity + productToAdd.quantity } : item);
          }
          return [...prev, { ...productToAdd, cartKey }];
        });
      };

      const updateQuantity = (cartKey, delta) => {
        setCart(prev => prev.map(item => {
          if (item.cartKey === cartKey) {
            const product = products.find(p => p.id === item.id);
            const maxStock = product ? product.stock : 99;
            const newQty = item.quantity + delta;
            if (newQty > maxStock) return item;
            return newQty > 0 ? { ...item, quantity: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const deductStock = (cartItems) => {
        setProducts(prevProducts => prevProducts.map(prod => {
          const itemsPurchased = cartItems.filter(item => item.id === prod.id);
          const totalDeduction = itemsPurchased.reduce((sum, item) => sum + item.quantity, 0);
          return totalDeduction > 0 ? { ...prod, stock: Math.max(0, prod.stock - totalDeduction) } : prod;
        }));
      };

      const clearCart = () => {
        setCart([]);
        localStorage.removeItem(CART_STORAGE_KEY);
      };

      const [form, setForm] = useState({ name: '', phone: '', address: '', notes: '', payment: 'cod', promo: '' });

      const [promoError, setPromoError] = useState(false);
      const [isSubmitting, setIsSubmitting] = useState(false);

      const subtotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
      const isFreeShipping = subtotal >= SHIPPING_CONFIG.FREE_THRESHOLD;
      const shippingFee = isFreeShipping ? 0 : SHIPPING_CONFIG.FLAT_RATE;
      const discount = promoApplied ? Math.round((subtotal + shippingFee) * 0.1) : 0;
      const finalTotal = subtotal + shippingFee - discount;

      const handleApplyPromo = () => {
        if (form.promo.trim().toUpperCase() === 'PHOENIX10') {
          setPromoApplied(true);
          setPromoError(false);
        } else {
          setPromoError(true);
          setPromoApplied(false);
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!form.name || !form.phone || !form.address) return;
        setIsSubmitting(true);
        setTimeout(() => {
          const newOrder = {
            id: 'PX-' + Math.floor(100000 + Math.random() * 900000),
            date: new Date().toLocaleString(),
            items: [...cart],
            subtotal,
            shippingFee,
            discount,
            total: finalTotal,
            customer: { ...form },
            status: 'success'
          };
          try {
            const history = JSON.parse(localStorage.getItem(ORDER_HISTORY_STORAGE_KEY) || '[]');
            localStorage.setItem(ORDER_HISTORY_STORAGE_KEY, JSON.stringify([newOrder, ...history]));
          } catch (e) {}
          setIsSubmitting(false);
          onSuccess(newOrder);
        }, 800);
      };

        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">

                  rows="2"

                  type="text"
                  value={form.notes}
                  onChange={(e) => setForm({ ...form, notes: e.target.value })}
                  className="w-full bg-coffee-50 border border-coffee-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400"
                />
              </div>

              <div className="space-y-2">
                <label className="block text-xs font-bold text-coffee-700">{t.paymentMethod}</label>
                <div className="grid grid-cols-1 gap-2">
                  <label className={`flex items-center gap-3 p-3.5 rounded-2xl border cursor-pointer transition-all ${form.payment === 'cod' ? 'border-amber-600 bg-amber-50/50' : 'border-coffee-200'}`}>
                    <input type="radio" name="payment" value="cod" checked={form.payment === 'cod'} onChange={(e) => setForm({ ...form, payment: e.target.value })} className="text-amber-600 focus:ring-amber-500" />
                    <span className="text-xs font-bold text-coffee-900">{t.cod}</span>
                  </label>
                  <label className={`flex items-center gap-3 p-3.5 rounded-2xl border cursor-pointer transition-all ${form.payment === 'bank' ? 'border-amber-600 bg-amber-50/50' : 'border-coffee-200'}`}>
                    <input type="radio" name="payment" value="bank" checked={form.payment === 'bank'} onChange={(e) => setForm({ ...form, payment: e.target.value })} className="text-amber-600 focus:ring-amber-500" />
                    <span className="text-xs font-bold text-coffee-900">{t.bank}</span>
                  </label>
                  <label className={`flex items-center gap-3 p-3.5 rounded-2xl border cursor-pointer transition-all ${form.payment === 'momo' ? 'border-amber-600 bg-amber-50/50' : 'border-coffee-200'}`}>
                    <input type="radio" name="payment" value="momo" checked={form.payment === 'momo'} onChange={(e) => setForm({ ...form, payment: e.target.value })} className="text-amber-600 focus:ring-amber-500" />
                    <span className="text-xs font-bold text-coffee-900">{t.momo}</span>
                  </label>
                </div>
              </div>

              <div className="space-y-2">
                <label className="block text-xs font-bold text-coffee-700">{t.promoCodeLabel}</label>
                <div className="flex gap-2">
                  <input
                    type="text"
                    value={form.promo}
                    onChange={(e) => setForm({ ...form, promo: e.target.value })}
                    placeholder="PHOENIX10"
                    className="flex-grow bg-coffee-50 border border-coffee-200 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400"
                  />
                  <button type="button" onClick={handleApplyPromo} className="px-5 py-2.5 bg-coffee-800 hover:bg-coffee-900 text-amber-100 rounded-2xl text-xs font-bold transition-colors">
                    {t.applyPromo}
                  </button>
                </div>
                {promoApplied && <p className="text-[11px] text-green-600 font-bold">{t.promoApplied}</p>}
                {promoError && <p className="text-[11px] text-red-600 font-bold">{t.promoInvalid}</p>}
              </div>

              <div className="bg-coffee-50 p-4 rounded-2xl border border-coffee-200 space-y-2 text-xs">
                <div className="flex justify-between text-coffee-600"><span>{t.subtotal}</span><span>{subtotal.toLocaleString()} VND</span></div>
                <div className="flex justify-between text-coffee-600"><span>{t.shippingFee}</span><span>{shippingFee === 0 ? t.free : `${shippingFee.toLocaleString()} VND`}</span></div>
                {promoApplied && <div className="flex justify-between text-green-700 font-medium"><span>{t.discountAmount}</span><span>-{discount.toLocaleString()} VND</span></div>}
                <div className="flex justify-between text-sm font-bold text-coffee-900 pt-2 border-t border-coffee-200">
                  <span>{t.payable}</span>
                  <span className="text-amber-800 text-base">{finalTotal.toLocaleString()} VND</span>
                </div>
              </div>

              <button
                type="submit"
                disabled={isSubmitting}
                className="w-full py-4 bg-amber-700 hover:bg-amber-800 text-white rounded-2xl text-sm font-bold transition-all shadow-md flex items-center justify-center gap-2"
              >
                {isSubmitting ? t.submitting : t.submitOrder}
              </button>
            </form>
          </div>
        </div>
      );
    }

    function ReceiptModal({ order, lang, t, onClose }) {
      const handlePrint = () => {
        window.print();
      };

      const handleSendZalo = () => {
        const text = encodeURIComponent(`[${order.id}] PHOENIX CAFE 訂單明細\n姓名: ${order.customer.name}\n電話: ${order.customer.phone}\n地址: ${order.customer.address}\n總計: ${order.total.toLocaleString()} VND`);
        window.open(`https://zalo.me/84348246669?text=${text}`, '_blank');
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-lg w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-coffee-200 p-6 sm:p-8 space-y-6">
            <div className="flex items-center justify-between border-b border-coffee-100 pb-4">
              <h3 className="font-bold font-serif text-coffee-900 text-lg flex items-center gap-2"><Icons.CheckCircle className="h-5 w-5 text-green-600" /> {t.orderSuccess}</h3>
              <button onClick={onClose} className="p-2 rounded-full hover:bg-coffee-100 text-coffee-700 transition-colors"><Icons.X className="h-5 w-5" /></button>
            </div>

            <div id="printable-receipt" className="space-y-4 text-xs bg-white p-4 rounded-2xl border border-coffee-100">
              <div className="text-center space-y-1">
                <h4 className="font-serif font-bold text-base text-coffee-900">phoenix CAFE</h4>
                <p className="text-[10px] text-coffee-500">{t.receiptTitle}</p>
              </div>

              <div className="space-y-1 pt-2 border-t border-dashed border-coffee-200">
                <p><strong>{t.orderId}：</strong>{order.id}</p>
                <p><strong>日期：</strong>{order.date}</p>
                <p><strong>{t.fullName}：</strong>{order.customer.name}</p>
                <p><strong>{t.phone}：</strong>{order.customer.phone}</p>
                <p><strong>{t.address}：</strong>{order.customer.address}</p>
                {order.customer.notes && <p><strong>{t.notes}：</strong>{order.customer.notes}</p>}
              </div>

              <div className="pt-2 border-t border-dashed border-coffee-200 space-y-2">
                {order.items.map((item, idx) => (
                  <div key={idx} className="flex justify-between">
                    <span>{item.name} ({item.spec}) x {item.quantity}</span>
                    <span className="font-bold">{(item.price * item.quantity).toLocaleString()} VND</span>
                  </div>
                ))}
              </div>

              <div className="pt-2 border-t border-dashed border-coffee-200 space-y-1 text-right">
                <p>{t.subtotal}：{order.subtotal.toLocaleString()} VND</p>
                <p>{t.shippingFee}：{order.shippingFee === 0 ? t.free : `${order.shippingFee.toLocaleString()} VND`}</p>
                {order.discount > 0 && <p>{t.discountAmount}：-{order.discount.toLocaleString()} VND</p>}
                <p className="text-sm font-bold text-coffee-900 pt-1 border-t border-coffee-200">{t.total}：{order.total.toLocaleString()} VND</p>
              </div>
            </div>

            <div className="flex flex-col sm:flex-row gap-3 pt-2">
              <button onClick={handlePrint} className="flex-1 py-3 bg-coffee-900 hover:bg-coffee-800 text-amber-100 rounded-2xl text-xs font-bold transition-colors flex items-center justify-center gap-2">
                <Icons.Printer className="h-4 w-4" /> {t.printReceipt}
              </button>
              <button onClick={handleSendZalo} className="flex-1 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl text-xs font-bold transition-colors flex items-center justify-center gap-2">
                <Icons.Send className="h-4 w-4" /> {t.sendToZalo}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function HistoryModal({ lang, t, onClose, onViewReceipt }) {
      const [history, setHistory] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem(ORDER_HISTORY_STORAGE_KEY) || '[]');
        } catch (e) { return []; }
      });

      const handleClear = () => {
        if (confirm(t.confirmClear)) {
          localStorage.removeItem(ORDER_HISTORY_STORAGE_KEY);
          setHistory([]);
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-coffee-200 p-6 sm:p-8 space-y-6">
            <div className="flex items-center justify-between border-b border-coffee-100 pb-4">
              <h3 className="font-bold font-serif text-coffee-900 text-lg flex items-center gap-2"><Icons.Clock className="h-5 w-5 text-amber-800" /> {t.orderHistoryTitle}</h3>
              <div className="flex items-center gap-2">
                {history.length > 0 && (
                  <button onClick={handleClear} className="px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl text-xs font-bold transition-colors">
                    {t.clearHistory}
                  </button>
                )}
                <button onClick={onClose} className="p-2 rounded-full hover:bg-coffee-100 text-coffee-700 transition-colors"><Icons.X className="h-5 w-5" /></button>
              </div>
            </div>

            {history.length === 0 ? (
              <div className="text-center py-16 space-y-3">
                <Icons.FileText className="h-12 w-12 text-coffee-300 mx-auto" />
                <p className="text-sm text-coffee-500 font-medium">{t.noHistory}</p>
              </div>
            ) : (
              <div className="space-y-4">
                {history.map(order => (
                  <div key={order.id} className="p-4 rounded-2xl bg-coffee-50 border border-coffee-200/70 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <div className="space-y-1">
                      <span className="text-[10px] font-bold bg-amber-200/70 text-amber-900 px-2.5 py-0.5 rounded-full">{order.id}</span>
                      <h4 className="text-xs font-bold text-coffee-900">{order.customer.name} ({order.customer.phone})</h4>
                      <p className="text-[11px] text-coffee-500">{order.date}</p>
                    </div>
                    <div className="flex items-center gap-3 w-full sm:w-auto justify-between">
                      <span className="text-sm font-bold text-amber-800">{order.total.toLocaleString()} VND</span>
                      <button onClick={() => { onClose(); onViewReceipt(order); }} className="px-4 py-2 bg-coffee-900 hover:bg-coffee-800 text-amber-100 rounded-xl text-xs font-bold transition-colors">
                        {t.viewReceipt}
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    function AdminModal({ products, setProducts, lang, t, onClose }) {
      const [newProd, setNewProd] = useState({ nameZh: '', nameVi: '', category: 'arabica', specZh: '250公克', specVi: '250g', price: 150000, stock: 20, image: '', type: 'beans' });
      const [editingId, setEditingId] = useState(null);

      const handleAdd = (e) => {
        e.preventDefault();
        const item = {
          ...newProd,
          id: 'prod-' + Date.now(),
          origin: '精選高海拔莊園豆',
          altitude: '1,200m+',
          process: '水洗/日曬',
          grade: 'Specialty',
          flavor: '濃郁平衡'
        };
        setProducts([item, ...products]);
        setNewProd({ nameZh: '', nameVi: '', category: 'arabica', specZh: '250公克', specVi: '250g', price: 150000, stock: 20, image: '', type: 'beans' });
      };

      const handleDelete = (id) => {
        if (confirm('確定要刪除此產品？')) {
          setProducts(products.filter(p => p.id !== id));
        }
      };

      const handleStockChange = (id, delta) => {
        setProducts(products.map(p => p.id === id ? { ...p, stock: Math.max(0, p.stock + delta) } : p));
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-4xl w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-coffee-200 p-6 sm:p-8 space-y-6">
            <div className="flex items-center justify-between border-b border-coffee-100 pb-4">
              <h3 className="font-bold font-serif text-coffee-900 text-lg flex items-center gap-2"><Icons.Settings className="h-5 w-5 text-amber-800" /> {t.adminTitle}</h3>
              <button onClick={onClose} className="p-2 rounded-full hover:bg-coffee-100 text-coffee-700 transition-colors"><Icons.X className="h-5 w-5" /></button>
            </div>

            <form onSubmit={handleAdd} className="bg-coffee-50 p-5 rounded-2xl border border-coffee-200 space-y-4">
              <h4 className="text-xs font-bold font-serif text-coffee-900 uppercase tracking-wider">{t.addProductTitle}</h4>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <input type="text" placeholder={t.productNameZh} required value={newProd.nameZh} onChange={(e) => setNewProd({ ...newProd, nameZh: e.target.value })} className="bg-white border border-coffee-200 rounded-xl px-3 py-2 text-xs" />
                <input type="text" placeholder={t.productNameVi} required value={newProd.nameVi} onChange={(e) => setNewProd({ ...newProd, nameVi: e.target.value })} className="bg-white border border-coffee-200 rounded-xl px-3 py-2 text-xs" />
                <select value={newProd.category} onChange={(e) => setNewProd({ ...newProd, category: e.target.value })} className="bg-white border border-coffee-200 rounded-xl px-3 py-2 text-xs">
                  <option value="arabica">Arabica</option>
                  <option value="robusta">Robusta</option>
                  <option value="blend">Blend</option>
                  <option value="coldbrew">Cold Brew</option>
                </select>
                <input type="text" placeholder={t.specZhInput} required value={newProd.specZh} onChange={(e) => setNewProd({ ...newProd, specZh: e.target.value })} className="bg-white border border-coffee-200 rounded-xl px-3 py-2 text-xs" />
                <input type="number" placeholder={t.priceInput} required value={newProd.price} onChange={(e) => setNewProd({ ...newProd, price: Number(e.target.value) })} className="bg-white border border-coffee-200 rounded-xl px-3 py-2 text-xs" />
                <input type="number" placeholder={t.stockInput} required value={newProd.stock} onChange={(e) => setNewProd({ ...newProd, stock: Number(e.target.value) })} className="bg-white border border-coffee-200 rounded-xl px-3 py-2 text-xs" />
                <input type="text" placeholder={t.imageUrlInput} required value={newProd.image} onChange={(e) => setNewProd({ ...newProd, image: e.target.value })} className="bg-white border border-coffee-200 rounded-xl px-3 py-2 text-xs sm:col-span-2" />
              </div>
              <button type="submit" className="w-full py-2.5 bg-coffee-900 hover:bg-coffee-800 text-amber-100 rounded-xl text-xs font-bold transition-colors">
                {t.saveNewProduct}
              </button>
            </form>

            <div className="space-y-3">
              <h4 className="text-xs font-bold font-serif text-coffee-900 uppercase tracking-wider">現有商品列表與庫存管理</h4>
              {products.map(p => (
                <div key={p.id} className="flex items-center justify-between p-3.5 bg-coffee-50 rounded-2xl border border-coffee-200/60 gap-4">
                  <img src={p.image} alt={p.nameZh} className="w-12 h-12 object-cover rounded-xl bg-white" />
                  <div className="flex-grow space-y-0.5">
                    <h5 className="text-xs font-bold text-coffee-900">{p.nameZh} ({p.specZh})</h5>
                    <span className="text-[11px] text-amber-800 font-bold">{p.price.toLocaleString()} VND</span>
                  </div>
                  <div className="flex items-center gap-2 bg-white px-2 py-1 rounded-xl border border-coffee-200">
                    <button onClick={() => handleStockChange(p.id, -1)} className="text-coffee-600 hover:text-coffee-900"><Icons.Minus className="h-3.5 w-3.5" /></button>
                    <span className="text-xs font-bold w-6 text-center">{p.stock}</span>
                    <button onClick={() => handleStockChange(p.id, 1)} className="text-coffee-600 hover:text-coffee-900"><Icons.Plus className="h-3.5 w-3.5" /></button>
                  </div>
                  <button onClick={() => handleDelete(p.id)} className="p-2 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl transition-colors">
                    <Icons.Trash className="h-4 w-4" />
                  </button>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function PasswordModal({ t, onSuccess, onClose }) {
      const [pwd, setPwd] = useState('');
      const [error, setError] = useState(false);

      const handleCheck = (e) => {
        e.preventDefault();
        if (pwd === ADMIN_PASSWORD) {
          setError(false);
          onSuccess();
        } else {
          setError(true);
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-sm w-full p-6 sm:p-8 space-y-6 shadow-2xl border border-coffee-200 text-center">
            <div className="w-12 h-12 bg-amber-100 text-amber-900 rounded-2xl flex items-center justify-center mx-auto">
              <Icons.Lock className="h-6 w-6" />
            </div>
            <div>
              <h3 className="font-bold font-serif text-coffee-900 text-lg">{t.historyPasswordTitle}</h3>
              <p className="text-xs text-coffee-500 mt-1">{t.historyPasswordDesc}</p>
            </div>
            <form onSubmit={handleCheck} className="space-y-4">
              <input
                type="password"
                required
                placeholder={t.passwordPlaceholder}
                value={pwd}
                onChange={(e) => setPwd(e.target.value)}
                className="w-full bg-coffee-50 border border-coffee-200 rounded-2xl px-4 py-3 text-center text-sm focus:outline-none focus:ring-2 focus:ring-amber-400"
              />
              {error && <p className="text-xs text-red-600 font-bold">{t.passwordError}</p>}
              <div className="flex gap-2">
                <button type="button" onClick={onClose} className="flex-1 py-3 bg-coffee-100 hover:bg-coffee-200 text-coffee-800 rounded-2xl text-xs font-bold transition-colors">{t.close}</button>
                <button type="submit" className="flex-1 py-3 bg-coffee-900 hover:bg-coffee-800 text-amber-100 rounded-2xl text-xs font-bold transition-colors">{t.passwordSubmit}</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function GuideModal({ lang, t, onClose }) {
      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-coffee-200 p-6 sm:p-8 space-y-6">
            <div className="flex items-center justify-between border-b border-coffee-100 pb-4">
              <h3 className="font-bold font-serif text-coffee-900 text-lg flex items-center gap-2"><Icons.BookOpen className="h-5 w-5 text-amber-800" /> {t.coffeeGuide}</h3>
              <button onClick={onClose} className="p-2 rounded-full hover:bg-coffee-100 text-coffee-700 transition-colors"><Icons.X className="h-5 w-5" /></button>
            </div>
            <div className="space-y-4 text-xs text-coffee-700 leading-relaxed">
              <h4 className="font-serif font-bold text-sm text-coffee-900">1. 阿拉比卡 (Arabica) 與羅布斯塔 (Robusta) 的差異</h4>
              <p>阿拉比卡豆生長於高海拔山區，風味層次豐富、帶有優雅果酸與花香；羅布斯塔豆則具備強烈厚實的口感、濃郁 Crema 與黑可可尾韻。</p>
              <h4 className="font-serif font-bold text-sm text-coffee-900">2. 咖啡豆最佳保存秘訣</h4>
              <p>請將咖啡豆置於單向排氣閥的密封罐內，存放於陰涼乾燥處，避免陽光直射與高溫潮濕。建議在烘焙後 30 天內飲用完畢以品嚐最佳風味。</p>
            </div>
          </div>
        </div>
      );
    }

    function TrainingModal({ lang, t, onClose }) {
      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-coffee-200 p-6 sm:p-8 space-y-6">
            <div className="flex items-center justify-between border-b border-coffee-100 pb-4">
              <h3 className="font-bold font-serif text-coffee-900 text-lg flex items-center gap-2"><Icons.GraduationCap className="h-5 w-5 text-amber-800" /> {t.roastTraining}</h3>
              <button onClick={onClose} className="p-2 rounded-full hover:bg-coffee-100 text-coffee-700 transition-colors"><Icons.X className="h-5 w-5" /></button>
            </div>
            <div className="space-y-4 text-xs text-coffee-700 leading-relaxed">
              <h4 className="font-serif font-bold text-sm text-coffee-900">專業職人烘焙培訓課程大綱</h4>
              <p>• <strong>單元一：生豆物理特性分析</strong>（含水分、密度與瑕疵豆挑選）</p>
              <p>• <strong>單元二：烘焙機曲線控制</strong>（轉速、風門、火力調節與一爆點掌握）</p>
              <p>• <strong>單元三：杯測與風味調校</strong>（SCA 標準杯測表評分與風味輪解析）</p>
              <p className="pt-2 text-amber-800 font-bold">歡迎透過右下角 Zalo 客服聯繫報名詳情與開課梯次！</p>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
