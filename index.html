            return newQty > 0 ? { ...item, quantity: newQty } : null;

          return item;
        }).filter(Boolean));

    function CheckoutModal({ cart, lang, t, subtotal, shippingFee, finalTotal, onClose, onSuccess }) {
      const [formData, setFormData] = useState({ name: '', phone: '', address: '', notes: '' });
      const [isSubmitting, setIsSubmitting] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setIsSubmitting(true);

        const orderData = {
          orderId: 'PHX-' + Math.floor(100000 + Math.random() * 900000),
          date: new Date().toLocaleString(),
          customer: formData,
          items: cart,
          subtotal,
          shippingFee,
          total: finalTotal,
          lang
        };

        // Save to local order history
        try {
          const history = JSON.parse(localStorage.getItem(ORDER_HISTORY_STORAGE_KEY) || '[]');
          localStorage.setItem(ORDER_HISTORY_STORAGE_KEY, JSON.stringify([orderData, ...history]));
        } catch (err) {}

        // Send to Google Sheets (via fetch no-cors or JSONP simulator)
        try {
          const payload = {
            orderId: orderData.orderId,
            date: orderData.date,
            name: formData.name,
            phone: formData.phone,
            address: formData.address,
            notes: formData.notes,
            total: finalTotal,
            items: cart.map(i => `${i.name} (${i.spec}) x${i.quantity}`).join('; ')
          };
          // Try sending to Google Apps Script endpoint if active
          fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          }).catch(() => {});
        } catch (e) {}

        setTimeout(() => {
          setIsSubmitting(false);
          onSuccess(orderData);
        }, 800);
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
            <div className="p-5 border-b border-coffee-200 flex items-center justify-between bg-coffee-50">

            </div>
            
            <form onSubmit={handleSubmit} className="p-6 overflow-y-auto space-y-4">
              <div>
                <label className="text-xs font-bold text-coffee-800 uppercase block mb-1">{t.fullName}</label>
                <input
                  type="text"
                  required
                  value={formData.name}
                  onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                  className="w-full px-4 py-2.5 bg-coffee-50 border border-coffee-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-coffee-600 focus:bg-white"
                />
              </div>
              <div>
                <label className="text-xs font-bold text-coffee-800 uppercase block mb-1">{t.phone}</label>
                <input
                  type="tel"
                  required
                  value={formData.phone}
                  onChange={(e) => setFormData({ ...formData, phone: e.target.value })}
                  className="w-full px-4 py-2.5 bg-coffee-50 border border-coffee-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-coffee-600 focus:bg-white"
                />
              </div>
              <div>
                <label className="text-xs font-bold text-coffee-800 uppercase block mb-1">{t.address}</label>
                <textarea
                  required
                  rows="3"
                  value={formData.address}
                  onChange={(e) => setFormData({ ...formData, address: e.target.value })}
                  className="w-full px-4 py-2.5 bg-coffee-50 border border-coffee-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-coffee-600 focus:bg-white"
                ></textarea>
              </div>
              <div>
                <label className="text-xs font-bold text-coffee-800 uppercase block mb-1">{t.notes}</label>
                <input
                  type="text"
                  value={formData.notes}
                  onChange={(e) => setFormData({ ...formData, notes: e.target.value })}

              </div>

              <div className="bg-coffee-50 p-4 rounded-xl space-y-1.5 text-xs text-coffee-700 border border-coffee-200">
                <div className="flex justify-between"><span>{t.subtotal}</span><span className="font-semibold">{subtotal.toLocaleString()} VND</span></div>
                <div className="flex justify-between"><span>{t.shippingFee}</span><span className="font-semibold">{shippingFee === 0 ? t.free : `${shippingFee.toLocaleString()} VND`}</span></div>
                <div className="flex justify-between font-bold text-coffee-900 pt-2 border-t border-coffee-200 text-sm"><span>{t.payable}</span><span className="text-amber-700">{finalTotal.toLocaleString()} VND</span></div>
              </div>

              <button
                type="submit"
                disabled={isSubmitting}

        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
            <div className="p-4 border-b border-coffee-200 flex items-center justify-between bg-coffee-50">
              <span className="font-serif font-bold text-coffee-900">{t.receiptTitle}</span>
              <button onClick={onClose} className="p-1.5 rounded-full hover:bg-coffee-200 text-coffee-700"><Icons.X className="w-5 h-5" /></button>
            </div>

            <div id="printable-receipt" className="p-8 overflow-y-auto space-y-6 text-coffee-900 bg-white font-sans text-xs">
              <div className="text-center space-y-1">
                <h2 className="font-serif text-2xl font-bold tracking-wider">phoenix CAFE</h2>
                <p className="text-[11px] text-coffee-500">Specialty Coffee Roastery & Store</p>
                <p className="text-xs font-semibold mt-2">{t.orderId}: {order.orderId}</p>
                <p className="text-[11px] text-coffee-500">{order.date}</p>
              </div>

              <div className="border-t border-b border-coffee-300 py-3 space-y-1">
                <div><span className="font-bold">{t.fullName}:</span> {order.customer.name}</div>
                <div><span className="font-bold">{t.phone}:</span> {order.customer.phone}</div>
                <div><span className="font-bold">{t.address}:</span> {order.customer.address}</div>
                {order.customer.notes && <div><span className="font-bold">{t.notes}:</span> {order.customer.notes}</div>}
              </div>

              <div className="space-y-2">
                <div className="font-bold border-b pb-1 text-coffee-800">Order Items</div>
                {order.items.map((item, idx) => (
                  <div key={idx} className="flex justify-between py-1 border-b border-dashed border-coffee-200">
                    <div>
                      <div className="font-bold">{item.name}</div>
                      <div className="text-[10px] text-coffee-500">{item.spec} {item.grind && `(${item.grind})`} x {item.quantity}</div>
                    </div>
                    <div className="font-semibold">{(item.price * item.quantity).toLocaleString()} VND</div>
                  </div>
                ))}
              </div>

              <div className="space-y-1 pt-2 border-t border-coffee-300 text-right">
                <div>{t.subtotal}: {order.subtotal.toLocaleString()} VND</div>
                <div>{t.shippingFee}: {order.shippingFee === 0 ? t.free : `${order.shippingFee.toLocaleString()} VND`}</div>
                <div className="text-sm font-bold text-coffee-900 pt-1">{t.total}: {order.total.toLocaleString()} VND</div>
              </div>

              <div className="text-center text-[10px] text-coffee-400 pt-6">
                *** Cảm ơn quý khách đã ủng hộ phoenix CAFE ***
              </div>
            </div>

            <div className="p-4 border-t border-coffee-200 bg-coffee-50 flex items-center justify-between">
              <button onClick={onClose} className="px-4 py-2 border border-coffee-300 rounded-xl text-xs font-semibold text-coffee-700 hover:bg-coffee-100">{t.close}</button>
              <button onClick={handlePrint} className="px-6 py-2 bg-coffee-800 hover:bg-coffee-900 text-white rounded-xl text-xs font-bold tracking-wide flex items-center space-x-1.5 shadow">
                <Icons.Printer className="w-4 h-4" />
                <span>{t.printReceipt}</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
