      };

      const filteredProducts = useMemo(() => {
        return products.filter(product => {
          const matchesCategory = selectedCategory === 'all' || product.category === selectedCategory;
          const name = lang === 'zh-TW' ? product.nameZh : product.nameVi;
          const matchesSearch = name.toLowerCase().includes(searchQuery.toLowerCase());
          return matchesCategory && matchesSearch;
        });
      }, [products, selectedCategory, searchQuery, lang]);

      const handleAddToCart = (productToAdd) => {
        setCart(prev => {
          const cartKey = `${productToAdd.id}-${productToAdd.grind || 'default'}`;
          const existing = prev.find(item => item.cartKey === cartKey);
          if (existing) {
            return prev.map(item => item.cartKey === cartKey ? { ...item, quantity: item.quantity + productToAdd.quantity } : item);
          }
          return [...prev, { ...productToAdd, cartKey }];
        });
      };

      const updateQuantity = (cartKey, delta) => {
        setCart(prev => prev.map(item => {
          if (item.cartKey === cartKey) {
            const product = products.find(p => p.id === item.id);
            const maxStock = product ? product.stock : 99;
            const newQty = item.quantity + delta;
            if (newQty > maxStock) return item;
            return newQty > 0 ? { ...item, quantity: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const deductStock = (cartItems) => {
        setProducts(prevProducts => prevProducts.map(prod => {
          const itemsPurchased = cartItems.filter(item => item.id === prod.id);
          const totalDeduction = itemsPurchased.reduce((sum, item) => sum + item.quantity, 0);
          return totalDeduction > 0 ? { ...prod, stock: Math.max(0, prod.stock - totalDeduction) } : prod;
        }));
      };

      const clearCart = () => {
        setCart([]);
        localStorage.removeItem(CART_STORAGE_KEY);

      const [formData, setFormData] = useState({ fullName: '', phone: '', address: '', notes: '', paymentMethod: 'Bank Transfer' });
      const [promoCode, setPromoCode] = useState('');
      const [discountRate, setDiscountRate] = useState(0);
      const [promoMessage, setPromoMessage] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [isSuccess, setIsSuccess] = useState(false);

      const [tempOrderId] = useState(() => `${new Date().getFullYear()}${Math.random().toString(36).substring(2, 6).toUpperCase()}`);

      const subtotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
      const discount = Math.round(subtotal * discountRate);
      const discountedSubtotal = subtotal - discount;
      const isFreeShipping = discountedSubtotal >= SHIPPING_CONFIG.FREE_THRESHOLD || discountedSubtotal === 0;
      const shippingFee = isFreeShipping ? 0 : SHIPPING_CONFIG.FLAT_RATE;
      const grandTotal = discountedSubtotal + shippingFee;

      const vietcombankQRUrl = useMemo(() => {
        const accountNo = '0121000852742';
        const accountName = 'MIU KIM PHUONG';
        const addInfo = `PHOENIX ${tempOrderId}`;
        return `https://img.vietqr.io/image/970436-${accountNo}-compact2.png?amount=${grandTotal}&addInfo=${encodeURIComponent(addInfo)}&accountName=${encodeURIComponent(accountName)}`;
      }, [grandTotal, tempOrderId]);

      const handleApplyPromo = () => {
        if (promoCode.trim().toUpperCase() === 'PHOENIX10') {
          setDiscountRate(0.1);
          setPromoMessage(t.promoApplied);

          setDiscountRate(0);
          setPromoMessage(t.promoInvalid);

          `- ${item.name} (${item.spec}) [${item.grindLabel}] x ${item.quantity} ＝ ${(item.price * item.quantity).toLocaleString()} VND`

        const orderRecord = {
          id: orderId,
          date: orderDate,
          customerName: formData.fullName,
          phone: formData.phone,
          address: formData.address,
          notes: formData.notes,
          paymentMethod: formData.paymentMethod,
          items: cart.map(item => ({
            name: item.name,
            spec: item.spec,
            grindLabel: item.grindLabel,
            quantity: item.quantity,
            unitPrice: item.price
          })),
          subtotal,
          discount,
          shippingFee,
          grandTotal
        };

          await fetch(scriptURL, {

              orderId,
              orderDate,
              fullName: formData.fullName,

                  <div className="bg-amber-50/80 border border-amber-200 rounded-2xl p-4 text-center space-y-3">
                    <div className="flex items-center justify-center gap-2">
                      <span className="inline-block w-2.5 h-2.5 rounded-full bg-green-600 animate-ping"></span>
                      <span className="text-xs font-bold text-amber-900">Vietcombank 自動付款 QR Code</span>
                    </div>
                    <div className="bg-white p-3 rounded-xl inline-block shadow-sm border border-amber-100">
                      <img src={vietcombankQRUrl} alt="Vietcombank QR" className="w-48 h-auto mx-auto object-contain rounded" />
                    </div>
                    <div className="text-[11px] text-coffee-700 space-y-0.5">
                      <p><strong>戶名 (Tên):</strong> MIU KIM PHUONG</p>
                      <p><strong>帳號 (STK):</strong> 0121000852742 (PGD Trảng Bom)</p>
                      <p><strong>金額 (Số tiền):</strong> <span className="text-red-600 font-bold">{grandTotal.toLocaleString()} VND</span></p>
                      <p><strong>內文 (Nội dung):</strong> PHOENIX {tempOrderId}</p>
                    </div>
                  </div>
                )}

                <div className="space-y-1">
                  <label className="block text-xs font-bold text-coffee-800">{t.notes}</label>
                  <input type="text" name="notes" value={formData.notes} onChange={handleInputChange} className="w-full bg-gray-50 border border-coffee-200 rounded-2xl p-3 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-coffee-900" />
                </div>

                <div className="space-y-1.5 pt-2">
                  <label className="block text-xs font-bold text-coffee-800">{t.promoCodeLabel}</label>
                  <div className="flex gap-2">
                    <input type="text" placeholder="PHOENIX10" value={promoCode} onChange={(e) => setPromoCode(e.target.value)} className="flex-1 bg-gray-50 border border-coffee-200 rounded-2xl px-3 py-2 text-xs uppercase font-bold" />
                    <button type="button" onClick={handleApplyPromo} className="px-4 bg-coffee-800 text-white rounded-2xl text-xs font-bold hover:bg-coffee-900">{t.applyPromo}</button>
                  </div>
                  {promoMessage && <p className={`text-[11px] font-bold ${discountRate > 0 ? 'text-green-600' : 'text-red-600'}`}>{promoMessage}</p>}
                </div>

                <div className="bg-coffee-50 p-4 rounded-2xl border border-coffee-200/60 space-y-1.5 text-xs">
                  <div className="flex justify-between"><span>{t.subtotal}：</span><span>{subtotal.toLocaleString()} VND</span></div>
                  {discount > 0 && <div className="flex justify-between text-red-600 font-semibold"><span>{t.discountAmount}：</span><span>-{discount.toLocaleString()} VND</span></div>}
                  <div className="flex justify-between"><span>{t.shippingFee}：</span><span>{isFreeShipping ? t.free : `${shippingFee.toLocaleString()} VND`}</span></div>
                  <div className="flex justify-between font-bold text-sm sm:text-base text-coffee-900 pt-2 border-t border-coffee-200">
                    <span>{t.payable}</span><span className="text-amber-800">{grandTotal.toLocaleString()} VND</span>
                  </div>
                </div>

                <button
                  type="submit"
                  disabled={isSubmitting}
                  className="w-full bg-coffee-900 hover:bg-coffee-800 text-white font-bold py-4 rounded-2xl shadow-lg transition-all flex items-center justify-center gap-2 text-xs sm:text-sm"
                >
                  {isSubmitting ? t.submitting : t.submitOrder}
                </button>
              </form>
            )}
          </div>
        </div>
      );
    }

    function OrderHistoryModal({ isOpen, onClose, t, onViewReceipt }) {
      const [history, setHistory] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem(ORDER_HISTORY_STORAGE_KEY) || '[]');
        } catch (e) { return []; }
      });

      const handleClear = () => {
        if (confirm(t.confirmClear)) {
          localStorage.removeItem(ORDER_HISTORY_STORAGE_KEY);
          setHistory([]);
        }
      };

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4">
          <div className="fixed inset-0 bg-black/60 backdrop-blur-sm transition-opacity" onClick={onClose} />
          <div className="relative w-full max-w-2xl bg-white rounded-3xl shadow-2xl border border-coffee-200 p-6 sm:p-8 max-h-[90vh] overflow-y-auto z-10 flex flex-col">
            <div className="flex justify-between items-center mb-5 pb-4 border-b border-gray-100">
              <h2 className="text-base sm:text-xl font-bold font-serif text-coffee-900 flex items-center gap-2"><Icons.Clock className="h-5 w-5 text-coffee-800" /> {t.orderHistoryTitle}</h2>
              <button onClick={onClose} className="p-2 rounded-full hover:bg-gray-100 transition-colors"><Icons.X className="h-5 w-5" /></button>
            </div>

            <div className="flex-1 overflow-y-auto space-y-4 pr-1">
              {history.length === 0 ? (
                <div className="py-12 text-center text-gray-400 space-y-2">
                  <Icons.Clock className="h-10 w-10 mx-auto opacity-40" />
                  <p className="text-sm">{t.noHistory}</p>
                </div>
              ) : (
                history.map((order) => (
                  <div key={order.id} className="bg-coffee-50/60 p-4 sm:p-5 rounded-2xl border border-coffee-200/60 space-y-3">
                    <div className="flex flex-wrap justify-between items-center gap-2 pb-3 border-b border-coffee-200/50 text-xs">
                      <div>
                        <span className="font-bold text-coffee-900">{t.orderId}: #{order.id}</span>
                        <span className="text-gray-500 ml-3">{order.date}</span>
                      </div>
                      <span className="font-extrabold text-amber-800 text-sm">{order.grandTotal.toLocaleString()} VND</span>
                    </div>

                    <div className="text-xs space-y-1 text-gray-700">
                      <p><strong>收件人:</strong> {order.customerName} ({order.phone})</p>
                      <p><strong>地址:</strong> {order.address}</p>
                      <p><strong>付款方式:</strong> {order.paymentMethod || 'COD'}</p>
                    </div>

                    <div className="flex justify-end pt-2">
                      <button
                        onClick={() => { onClose(); onViewReceipt(order); }}
                        className="px-4 py-2 bg-coffee-900 hover:bg-coffee-800 text-white rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 shadow-sm"
                      >
                        <Icons.FileText className="h-3.5 w-3.5" /> {t.viewReceipt}
                      </button>
                    </div>
                  </div>
                ))
              )}
            </div>

            {history.length > 0 && (
              <div className="pt-4 border-t border-gray-100 mt-4 flex justify-between items-center">
                <button onClick={handleClear} className="text-xs text-red-600 hover:text-red-700 font-bold flex items-center gap-1">
                  <Icons.Trash className="h-4 w-4" /> {t.clearHistory}
                </button>
                <button onClick={onClose} className="px-5 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-xs font-bold transition-colors">
                  {t.close}
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
