                    try { setOrders(JSON.parse(savedOrders)); } catch(e) {}
                }
                const savedForm = localStorage.getItem('phoenix_user_form');
                if (savedForm) {
                    try { setFormData(JSON.parse(savedForm)); } catch(e) {}
                }
            }, []);

                const updated = { ...formData, [e.target.name]: e.target.value };

                localStorage.setItem('phoenix_user_form', JSON.stringify(updated));
            };

                setCart(prev => {
                    const existing = prev.find(item => item.id === product.id);
                    if (existing) {
                        return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
                    }
                    return [...prev, { ...product, qty: 1 }];
                });
                setIsCartOpen(true);
            };

                setCart(prev => prev.map(item => {
                    if (item.id === id) {
                        const newQty = item.qty + delta;
                        return newQty > 0 ? { ...item, qty: newQty } : null;
                    }
                    return item;
                }).filter(Boolean));
            };

            const finalTotal = cartTotal + shippingFee - discountAmount;

                if (promoCodeInput.trim().toUpperCase() === 'PHOENIX99') {
                    setAppliedDiscount(0.1);
                    setPromoMessage(t.promoApplied);
                } else {
                    setAppliedDiscount(0);
                    setPromoMessage(t.promoInvalid);

                    shippingFee,
                    discount: discountAmount,
                    customer: { ...formData },

                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(newOrder)

                setIsCartOpen(false);

                                                    <h4 className="font-serif font-bold text-lg text-amber-950 mb-2 line-clamp-1">{lang === 'vi' ? product.nameVi : lang === 'en' ? product.nameEn : product.nameZh}</h4>
                                                    <p className="text-stone-600 text-sm mb-4 line-clamp-2 flex-grow">{lang === 'vi' ? product.descVi : lang === 'en' ? product.descEn : product.descZh}</p>
                                                    <div className="flex items-center justify-between mt-auto pt-4 border-t border-stone-100">
                                                        <span className="text-amber-800 font-bold text-lg">{product.price.toLocaleString('vi-VN')} ₫</span>
                                                        <button onClick={() => addToCart(product)} className="bg-amber-800 hover:bg-amber-900 text-white px-4 py-2 rounded-xl text-sm font-medium transition-colors shadow-sm flex items-center space-x-2">
                                                            <i className="fa-solid fa-cart-plus"></i>
                                                            <span>{t.addToCart}</span>
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </section>
                            </div>
                        )}

                        {activeTab === 'menu' && (
                            <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
                                <div className="text-center mb-10">
                                    <h3 className="font-serif text-3xl font-bold text-amber-950 mb-3">{t.navMenu}</h3>
                                    <div className="w-20 h-1 bg-amber-700 mx-auto rounded-full mb-8"></div>
                                    {/* Category Filter */}
                                    <div className="flex flex-wrap justify-center gap-3">
                                        {['all', 'beans', 'drip', 'coldbrew'].map(cat => (
                                            <button key={cat} onClick={() => setSelectedCategory(cat)} className={`px-5 py-2.5 rounded-xl font-medium text-sm transition-all shadow-sm ${selectedCategory === cat ? 'bg-amber-800 text-white' : 'bg-white text-stone-700 hover:bg-stone-100 border border-stone-200'}`}>
                                                {cat === 'all' ? t.all : cat === 'beans' ? t.beans : cat === 'drip' ? t.drip : t.coldbrew}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                                    {productsData.filter(p => selectedCategory === 'all' || p.category === selectedCategory).map(product => (
                                        <div key={product.id} className="bg-white rounded-2xl shadow-md overflow-hidden border border-stone-200 flex flex-col hover:shadow-xl transition-all group">
                                            <div className="relative h-60 overflow-hidden bg-stone-100">
                                                <img src={product.image} alt={product.nameVi} loading="lazy" className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onError={(e)=>{e.target.src='https://placehold.co/600x400/f2e8e5/78350f?text=Phoenix+Coffee'}} />
                                                <span className="absolute top-3 left-3 bg-amber-900/80 text-white text-xs px-2.5 py-1 rounded-full backdrop-blur-sm">{product.unit}</span>
                                            </div>
                                            <div className="p-6 flex flex-col flex-grow">
                                                <h4 className="font-serif font-bold text-lg text-amber-950 mb-2 line-clamp-1">{lang === 'vi' ? product.nameVi : lang === 'en' ? product.nameEn : product.nameZh}</h4>
                                                <p className="text-stone-600 text-sm mb-4 line-clamp-2 flex-grow">{lang === 'vi' ? product.descVi : lang === 'en' ? product.descEn : product.descZh}</p>
                                                <div className="flex items-center justify-between mt-auto pt-4 border-t border-stone-100">
                                                    <span className="text-amber-800 font-bold text-lg">{product.price.toLocaleString('vi-VN')} ₫</span>
                                                    <button onClick={() => addToCart(product)} className="bg-amber-800 hover:bg-amber-900 text-white px-4 py-2 rounded-xl text-sm font-medium transition-colors shadow-sm flex items-center space-x-2">
                                                        <i className="fa-solid fa-cart-plus"></i>
                                                        <span>{t.addToCart}</span>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </section>
                        )}

                        {activeTab === 'story' && (
                            <section className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-20">
                                <div className="bg-white rounded-3xl p-8 sm:p-12 shadow-xl border border-stone-200">
                                    <div className="text-center mb-10">
                                        <h3 className="font-serif text-3xl font-bold text-amber-950 mb-3">{t.navStory}</h3>
                                        <div className="w-20 h-1 bg-amber-700 mx-auto rounded-full"></div>
                                    </div>
                                    <div className="space-y-6 text-stone-700 leading-relaxed text-lg">
                                        <p>Được thành lập với niềm đam mê bất tận dành cho hạt cà phê cao nguyên Việt Nam, <strong>Phoenix Coffee</strong> ra đời nhằm kết nối những nông trại cà phê đặc sản (Specialty Coffee) trứ danh tại Cầu Đất, Đăk Lăk trực tiếp đến tay người yêu cà phê.</p>
                                        <p>Chúng tôi tuân thủ quy trình rang mộc thủ công (Artisanal Roasting), kiểm soát nghiêm ngặt từng mẻ rang để giữ lại trọn vẹn hương vị hoa quả, nốt hương sô-côla và vị ngọt hậu tự nhiên nguyên bản nhất.</p>
                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-6 pt-6">
                                            <div className="bg-amber-50 p-6 rounded-2xl text-center border border-amber-100">
                                                <i className="fa-solid fa-seedling text-3xl text-amber-800 mb-3"></i>
                                                <h5 className="font-bold text-amber-950 mb-1">100% Hạt tuyển chọn</h5>
                                                <p className="text-sm text-stone-600">Thu hái thủ công chín mọng</p>
                                            </div>
                                            <div className="bg-amber-50 p-6 rounded-2xl text-center border border-amber-100">
                                                <i className="fa-solid fa-fire-burner text-3xl text-amber-800 mb-3"></i>
                                                <h5 className="font-bold text-amber-950 mb-1">Rang mộc chuẩn vị</h5>
                                                <p className="text-sm text-stone-600">Không tẩm ướp hương liệu</p>
                                            </div>
                                            <div className="bg-amber-50 p-6 rounded-2xl text-center border border-amber-100">
                                                <i className="fa-solid fa-heart text-3xl text-amber-800 mb-3"></i>
                                                <h5 className="font-bold text-amber-950 mb-1">Phục vụ tận tâm</h5>
                                                <p className="text-sm text-stone-600">Giao hàng tươi mới mỗi ngày</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </section>
                        )}

                        {activeTab === 'orders' && (
                            <section className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
                                <div className="text-center mb-12">
                                    <h3 className="font-serif text-3xl font-bold text-amber-950 mb-3">{t.historyTitle}</h3>
                                    <div className="w-20 h-1 bg-amber-700 mx-auto rounded-full"></div>
                                </div>

                                {orders.length === 0 ? (
                                    <div className="bg-white rounded-2xl p-12 text-center shadow-md border border-stone-200">
                                        <i className="fa-solid fa-receipt text-5xl text-stone-300 mb-4"></i>
                                        <p className="text-stone-500 text-lg">{t.noHistory}</p>
                                    </div>
                                ) : (
                                    <div className="space-y-6">
                                        {orders.map(order => (
                                            <div key={order.id} className="bg-white rounded-2xl p-6 sm:p-8 shadow-md border border-stone-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                                                <div className="space-y-2">
                                                    <div className="flex items-center space-x-3">
                                                        <span className="font-bold text-amber-950 text-lg">{order.id}</span>
                                                        <span className="text-xs bg-amber-100 text-amber-900 px-3 py-1 rounded-full font-medium">{order.date}</span>
                                                        {/* 動態物流狀態標籤 */}
                                                        <span className="text-xs bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-semibold flex items-center space-x-1">
                                                            <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                                            <span>{t[order.status] || t.statusPreparing}</span>
                                                        </span>
                                                    </div>
                                                    <p className="text-sm text-stone-600"><span className="font-medium text-stone-800">Khách hàng:</span> {order.customer.name} ({order.customer.phone})</p>
                                                    <p className="text-sm text-stone-600"><span className="font-medium text-stone-800">Địa chỉ:</span> {order.customer.address}</p>
                                                    <div className="pt-2 flex flex-wrap gap-2">
                                                        {order.items.map((item, idx) => (
                                                            <span key={idx} className="text-xs bg-stone-100 text-stone-700 px-2.5 py-1 rounded-lg border border-stone-200">
                                                                {lang === 'vi' ? item.nameVi : item.nameEn} x {item.qty}
                                                            </span>
                                                        ))}
                                                    </div>
                                                </div>
                                                <div className="flex flex-col items-end gap-3 w-full md:w-auto border-t md:border-t-0 pt-4 md:pt-0 border-stone-100">
                                                    <span className="text-xl font-bold text-amber-900">{order.total.toLocaleString('vi-VN')} ₫</span>
                                                    <button onClick={() => handlePrintReceipt(order)} className="bg-stone-800 hover:bg-stone-900 text-white px-4 py-2 rounded-xl text-sm font-medium transition-colors shadow-sm flex items-center space-x-2">
                                                        <i className="fa-solid fa-print"></i>
                                                        <span>{t.printReceipt}</span>
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </section>
                        )}
                    </main>

                    {}
                    {/* Cart Slide-over Drawer */}
                    {isCartOpen && (
                        <div className="fixed inset-0 z-50 overflow-hidden">
                            <div className="absolute inset-0 bg-stone-900/50 backdrop-blur-sm transition-opacity" onClick={() => setIsCartOpen(false)}></div>
                            <div className="absolute inset-y-0 right-0 max-w-full flex pl-10">
                                <div className="w-screen max-w-md bg-white shadow-2xl flex flex-col">
                                    <div className="p-6 bg-amber-950 text-white flex items-center justify-between">
                                        <h3 className="font-serif font-bold text-xl flex items-center space-x-2">
                                            <i className="fa-solid fa-shopping-cart"></i>
                                            <span>{t.cartTitle}</span>
                                        </h3>
                                        <button onClick={() => setIsCartOpen(false)} className="text-stone-300 hover:text-white p-2">
                                            <i className="fa-solid fa-xmark text-xl"></i>
                                        </button>
                                    </div>

                                    <div className="flex-1 overflow-y-auto p-6 space-y-4">
                                        {cart.length === 0 ? (
                                            <div className="text-center py-20 text-stone-500">
                                                <i className="fa-solid fa-basket-shopping text-5xl mb-4 text-stone-300"></i>
                                                <p>{t.emptyCart}</p>
                                            </div>
                                        ) : (
                                            cart.map(item => (
                                                <div key={item.id} className="flex items-center justify-between bg-stone-50 p-4 rounded-2xl border border-stone-200">
                                                    <div className="flex items-center space-x-4">
                                                        <img src={item.image} alt={item.nameVi} className="w-16 h-16 object-cover rounded-xl border border-stone-200" />
                                                        <div>
                                                            <h5 className="font-bold text-amber-950 text-sm line-clamp-1">{lang === 'vi' ? item.nameVi : item.nameEn}</h5>
                                                            <p className="text-amber-800 font-semibold text-sm">{item.price.toLocaleString('vi-VN')} ₫</p>
                                                        </div>
                                                    </div>
                                                    <div className="flex items-center space-x-3 bg-white px-3 py-1.5 rounded-xl border border-stone-200 shadow-sm">
                                                        <button onClick={() => updateQty(item.id, -1)} className="text-stone-600 hover:text-amber-800"><i className="fa-solid fa-minus text-xs"></i></button>
                                                        <span className="font-bold text-sm w-4 text-center">{item.qty}</span>
                                                        <button onClick={() => updateQty(item.id, 1)} className="text-stone-600 hover:text-amber-800"><i className="fa-solid fa-plus text-xs"></i></button>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>

                                    {cart.length > 0 && (
                                        <div className="p-6 bg-stone-50 border-t border-stone-200 space-y-4">
                                            {/* Promo Code Input */}
                                            <div className="flex space-x-2">
                                                <input 
                                                    type="text" 
                                                    placeholder={t.promoCode} 
                                                    value={promoCodeInput}
                                                    onChange={(e) => setPromoCodeInput(e.target.value)}
                                                    className="flex-1 px-4 py-2 bg-white border border-stone-300 rounded-xl text-sm focus:outline-none focus:border-amber-700"
                                                />
                                                <button onClick={handleApplyPromo} className="bg-stone-800 hover:bg-stone-900 text-white px-4 py-2 rounded-xl text-sm font-medium transition-colors">
                                                    {t.applyPromo}
                                                </button>
                                            </div>
                                            {promoMessage && <p className={`text-xs ${appliedDiscount > 0 ? 'text-emerald-600 font-semibold' : 'text-rose-600'}`}>{promoMessage}</p>}

                                            <div className="space-y-2 text-sm text-stone-600">
                                                <div className="flex justify-between">
                                                    <span>Tạm tính</span>
                                                    <span>{cartTotal.toLocaleString('vi-VN')} ₫</span>
                                                </div>
                                                {appliedDiscount > 0 && (
                                                    <div className="flex justify-between text-emerald-600 font-medium">
                                                        <span>Giảm giá (10%)</span>
                                                        <span>-{discountAmount.toLocaleString('vi-VN')} ₫</span>
                                                    </div>
                                                )}
                                                <div className="flex justify-between">
                                                    <span>{t.shippingFee}</span>
                                                    <span>{shippingFee === 0 ? 'Miễn phí' : shippingFee.toLocaleString('vi-VN') + ' ₫'}</span>
                                                </div>
                                                <div className="flex justify-between text-lg font-bold text-amber-950 pt-2 border-t border-stone-200">
                                                    <span>{t.total}</span>
                                                    <span className="text-amber-800">{finalTotal.toLocaleString('vi-VN')} ₫</span>
                                                </div>
                                            </div>
                                            <p className="text-xs text-stone-500 text-center">{t.shippingFree}</p>
                                            <button onClick={() => { setIsCartOpen(false); setIsCheckoutOpen(true); }} className="w-full bg-amber-800 hover:bg-amber-900 text-white py-3.5 rounded-xl font-semibold shadow-lg transition-all text-center">
                                                {t.checkout}
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Checkout Modal with localStorage Auto-fill */}
                    {isCheckoutOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/50 backdrop-blur-sm">
                            <div className="bg-white rounded-3xl max-w-lg w-full p-8 shadow-2xl border border-stone-200 max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="font-serif font-bold text-2xl text-amber-950">{t.checkoutTitle}</h3>
                                    <button onClick={() => setIsCheckoutOpen(false)} className="text-stone-400 hover:text-stone-700 p-2">
                                        <i className="fa-solid fa-xmark text-xl"></i>
                                    </button>
                                </div>

                                <form onSubmit={handleCheckoutSubmit} className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-stone-700 mb-1">{t.fullName} *</label>
                                        <input type="text" name="name" required value={formData.name} onChange={handleFormChange} className="w-full px-4 py-3 bg-stone-50 border border-stone-300 rounded-xl focus:outline-none focus:border-amber-700 font-medium" placeholder="Nguyen Van A" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-stone-700 mb-1">{t.phone} *</label>
                                        <input type="tel" name="phone" required value={formData.phone} onChange={handleFormChange} className="w-full px-4 py-3 bg-stone-50 border border-stone-300 rounded-xl focus:outline-none focus:border-amber-700 font-medium" placeholder="0901234567" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-stone-700 mb-1">{t.address} *</label>
                                        <textarea name="address" required rows="3" value={formData.address} onChange={handleFormChange} className="w-full px-4 py-3 bg-stone-50 border border-stone-300 rounded-xl focus:outline-none focus:border-amber-700 font-medium" placeholder="Số 123, Đường Nguyễn Huệ, Q.1, TP.HCM"></textarea>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-stone-700 mb-1">{t.note}</label>
                                        <input type="text" name="note" value={formData.note} onChange={handleFormChange} className="w-full px-4 py-3 bg-stone-50 border border-stone-300 rounded-xl focus:outline-none focus:border-amber-700 font-medium" placeholder="Giao hàng giờ hành chính..." />
                                    </div>

                                    <div className="pt-4 border-t border-stone-200 flex items-center justify-between mb-6">
                                        <span className="font-medium text-stone-600">Tổng thanh toán:</span>
                                        <span className="text-xl font-bold text-amber-800">{finalTotal.toLocaleString('vi-VN')} ₫</span>
                                    </div>

                                    <button type="submit" className="w-full bg-amber-800 hover:bg-amber-900 text-white py-4 rounded-xl font-bold shadow-lg transition-all text-center">
                                        {t.submitOrder}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Success Modal */}
                    {successModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/50 backdrop-blur-sm">
                            <div className="bg-white rounded-3xl max-w-md w-full p-8 text-center shadow-2xl border border-stone-200">
                                <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl shadow-inner">
                                    <i className="fa-solid fa-check"></i>
                                </div>
                                <h3 className="font-serif font-bold text-2xl text-amber-950 mb-2">{t.orderSuccess}</h3>
                                <p className="text-stone-600 mb-6">{t.orderSuccessSub}</p>
                                <div className="bg-stone-50 p-4 rounded-2xl mb-6 text-left border border-stone-200 space-y-1">
                                    <p className="text-xs text-stone-500"><span className="font-bold">Mã đơn hàng:</span> {successModal.id}</p>
                                    <p className="text-xs text-stone-500"><span className="font-bold">Người nhận:</span> {successModal.customer.name}</p>
                                    <p className="text-xs text-stone-500"><span className="font-bold">Tổng tiền:</span> {successModal.total.toLocaleString('vi-VN')} ₫</p>
                                </div>
                                <div className="flex space-x-3">
                                    <button onClick={() => { setSuccessModal(null); setActiveTab('orders'); }} className="flex-1 bg-stone-800 hover:bg-stone-900 text-white py-3 rounded-xl font-semibold transition-colors">
                                        Xem đơn hàng
                                    </button>
                                    <button onClick={() => setSuccessModal(null)} className="flex-1 bg-amber-800 hover:bg-amber-900 text-white py-3 rounded-xl font-semibold transition-colors">
                                        {t.close}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    {/* 右下角懸浮快速聯絡按鈕 (Zalo / Messenger) */}
                    <div className="fixed bottom-6 right-6 z-40 flex flex-col items-end space-y-3">
                        {isChatMenuOpen && (
                            <div className="bg-white rounded-2xl shadow-2xl border border-stone-200 p-3 flex flex-col space-y-2 w-52 animate-fadeIn">
                                <a href="https://zalo.me" target="_blank" rel="noopener noreferrer" className="flex items-center space-x-3 p-2.5 rounded-xl hover:bg-blue-50 text-blue-600 font-medium transition-colors">
                                    <div className="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xs">Zalo</div>
                                    <span className="text-sm">{t.quickChatZalo}</span>
                                </a>
                                <a href="https://m.me" target="_blank" rel="noopener noreferrer" className="flex items-center space-x-3 p-2.5 rounded-xl hover:bg-indigo-50 text-indigo-600 font-medium transition-colors">
                                    <div className="w-8 h-8 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-xs"><i className="fa-brands fa-facebook-messenger"></i></div>
                                    <span className="text-sm">{t.quickChatMessenger}</span>
                                </a>
                            </div>
                        )}
                        <button onClick={() => setIsChatMenuOpen(!isChatMenuOpen)} className="w-14 h-14 bg-amber-800 hover:bg-amber-900 text-white rounded-full shadow-2xl flex items-center justify-center text-xl transition-all animate-pulse-slow">
                            <i className={`fa-solid ${isChatMenuOpen ? 'fa-xmark' : 'fa-headset'}`}></i>
                        </button>
                    </div>

                    {/* Footer */}
                    <footer className="bg-amber-950 text-stone-300 py-12 mt-auto border-t border-amber-900">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 md:grid-cols-3 gap-8">
                            <div>
                                <h4 className="font-serif text-xl font-bold text-white mb-3">Phoenix Coffee</h4>
                                <p className="text-sm text-stone-400">Thương hiệu cà phê thủ công cao cấp hàng đầu, mang hương vị nguyên bản từ cao nguyên đến từng tách cà phê của bạn.</p>
                            </div>
                            <div>
                                <h5 className="font-bold text-white mb-3 text-sm tracking-wider uppercase">Liên hệ</h5>
                                <p className="text-sm text-stone-400 mb-2"><i className="fa-solid fa-location-dot mr-2 text-amber-600"></i> Quận 1, TP. Hồ Chí Minh, Việt Nam</p>
                                <p className="text-sm text-stone-400 mb-2"><i className="fa-solid fa-phone mr-2 text-amber-600"></i> +84 90 123 4567</p>
                                <p className="text-sm text-stone-400"><i className="fa-solid fa-envelope mr-2 text-amber-600"></i> contact@phoenixcoffee.vn</p>
                            </div>
                            <div>
                                <h5 className="font-bold text-white mb-3 text-sm tracking-wider uppercase">Giờ mở cửa</h5>
                                <p className="text-sm text-stone-400 mb-2">Thứ Hai - Chủ Nhật: 7:00 - 22:00</p>
                                <div className="flex space-x-4 mt-4 text-lg">
                                    <a href="#" className="text-stone-400 hover:text-white transition-colors"><i className="fa-brands fa-facebook"></i></a>
                                    <a href="#" className="text-stone-400 hover:text-white transition-colors"><i className="fa-brands fa-instagram"></i></a>
                                    <a href="#" className="text-stone-400 hover:text-white transition-colors"><i className="fa-brands fa-tiktok"></i></a>
                                </div>
                            </div>
                        </div>
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 mt-8 border-t border-amber-900/50 text-center text-xs text-stone-500">
                            &copy; 2026 Phoenix Coffee. All rights reserved.
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
