<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHOENIX COFFEE | 頂級精品咖啡與職人選物</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        aura: {
                            50: '#fcfbfa',
                            100: '#f4f0ec',
                            200: '#e5ddd3',
                            300: '#bfae9e',
                            800: '#38322c',
                            900: '#221e1a',
                        },
                        coffee: {
                            light: '#d7c4b7',
                            DEFAULT: '#6f4e37',
                            dark: '#3c2415'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif']
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <!-- Alpine.js for interactive reactive state -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fcfbfa; color: #221e1a; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body x-data="phoenixCoffeeApp()" class="antialiased selection:bg-coffee selection:text-white">

    <!-- 頂部公告 -->
    <div class="bg-aura-900 text-aura-100 text-xs py-2 text-center tracking-widest uppercase font-medium" x-text="t.topBanner"></div>

    <!-- 導覽列 -->
    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-aura-200 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <button @click="mobileMenuOpen = true" class="lg:hidden text-aura-900 focus:outline-none p-2">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>

            <div class="flex items-center space-x-12">
                <a href="#" @click.prevent="currentView = 'home'" class="text-2xl font-bold tracking-widest uppercase font-serif">
                    PHOENIX <span class="text-coffee">COFFEE</span>
                </a>
                <nav class="hidden lg:flex space-x-8 text-xs font-medium uppercase tracking-widest text-aura-800">
                    <a href="#" @click.prevent="currentView = 'home'" class="hover:text-coffee transition-colors" :class="currentView === 'home' ? 'border-b-2 border-coffee pb-1 text-coffee' : ''" x-text="t.navHome"></a>
                    <a href="#" @click.prevent="currentView = 'shop'; filterCategory = 'all'" class="hover:text-coffee transition-colors" :class="currentView === 'shop' ? 'border-b-2 border-coffee pb-1 text-coffee' : ''" x-text="t.navShop"></a>
                    <a href="#" @click.prevent="currentView = 'shop'; filterCategory = 'beans'" class="hover:text-coffee transition-colors" x-text="t.navBeans"></a>
                    <a href="#" @click.prevent="currentView = 'shop'; filterCategory = 'drip'" class="hover:text-coffee transition-colors" x-text="t.navDrip"></a>
                    <a href="#" @click.prevent="currentView = 'shop'; filterCategory = 'equipment'" class="hover:text-coffee transition-colors" x-text="t.navEquipment"></a>
                </nav>
            </div>

            <div class="flex items-center space-x-5">
                <button @click="toggleLang()" class="text-xs font-bold uppercase border border-aura-300 px-2.5 py-1 rounded-sm hover:border-coffee hover:text-coffee transition-colors" x-text="lang === 'zh' ? 'VN' : '繁中'" title="切換語言 / Đổi ngôn ngữ"></button>
                <button @click="searchOpen = true" class="text-aura-900 hover:text-coffee transition-colors p-2" :title="t.searchTitle">
                    <i class="fa-solid fa-magnifying-glass text-lg"></i>
                </button>
                <button @click="currentView = 'account'" class="hidden sm:block text-aura-900 hover:text-coffee transition-colors p-2" :title="t.accountTitle">
                    <i class="fa-regular fa-user text-lg"></i>
                </button>
                <button @click="cartOpen = true" class="relative text-aura-900 hover:text-coffee transition-colors p-2" :title="t.cartTitle">
                    <i class="fa-solid fa-bag-shopping text-lg"></i>
                    <span x-show="cartCount > 0" x-text="cartCount" class="absolute top-0 right-0 bg-coffee text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold"></span>
                </button>
            </div>
        </div>
    </header>

    <main class="min-h-screen">
        <!-- 首頁 -->
        <div x-show="currentView === 'home'" x-transition.opacity.duration.300ms>
            <div class="relative bg-aura-100 overflow-hidden h-[85vh] flex items-center">
                <div class="absolute inset-0 z-0">
                    <img src="https://placehold.co/1920x1080/e5ddd3/221e1a?text=PHOENIX+COFFEE+ROASTERS" alt="Hero" class="w-full h-full object-cover object-center opacity-85">
                    <div class="absolute inset-0 bg-gradient-to-r from-aura-900/60 via-aura-900/20 to-transparent"></div>
                </div>
                <div class="relative z-10 max-w-7xl mx-auto px-6 sm:px-6 lg:px-12 w-full text-white">
                    <span class="text-xs uppercase tracking-[0.25em] bg-white/20 backdrop-blur-md px-3 py-1.5 rounded-full mb-6 inline-block font-medium" x-text="t.heroSubtitle"></span>
                    <h1 class="text-4xl sm:text-6xl font-light tracking-wide mb-6 leading-tight font-serif" x-html="t.heroTitle"></h1>
                    <p class="text-sm sm:text-base text-aura-100 max-w-lg mb-8 font-light leading-relaxed" x-text="t.heroDesc"></p>
                    <div class="flex flex-wrap gap-4">
                        <button @click="currentView = 'shop'" class="bg-white text-aura-900 px-8 py-3.5 text-xs uppercase tracking-widest font-semibold hover:bg-coffee hover:text-white transition-all shadow-lg rounded-sm" x-text="t.btnShopNow"></button>
                        <button @click="currentView = 'shop'; filterCategory = 'drip'" class="border border-white/80 text-white px-8 py-3.5 text-xs uppercase tracking-widest font-semibold hover:bg-white hover:text-aura-900 transition-all rounded-sm" x-text="t.btnExploreDrip"></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 商品列表頁 -->
        <div x-show="currentView === 'shop'" x-transition.opacity class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
            <div class="flex justify-between items-center border-b border-aura-200 pb-6 mb-8">
                <h1 class="text-3xl font-light tracking-wide font-serif">
                    <span x-text="t.catalogTitle"></span>
                </h1>
                <select x-model="filterCategory" class="bg-white border border-aura-200 text-xs uppercase tracking-wider py-2.5 px-4 rounded-sm">
                    <option value="all" x-text="t.catAll"></option>
                    <option value="beans" x-text="t.catBeans"></option>
                    <option value="drip" x-text="t.catDrip"></option>
                    <option value="equipment" x-text="t.catEquip"></option>
                </select>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
                <template x-for="product in filteredProducts" :key="product.id">
                    <div class="group cursor-pointer bg-white border border-aura-100 rounded-sm p-4 hover:shadow-lg transition-all flex flex-col justify-between" @click="openProductDetail(product)">
                        <div>
                            <div class="relative bg-aura-100 aspect-[3/4] overflow-hidden rounded-sm mb-4">
                                <img :src="product.image" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                            </div>
                            <h3 class="text-sm font-medium text-aura-900 tracking-wide mt-1" x-text="getProductName(product)"></h3>
                        </div>
                        <div class="flex items-center justify-between mt-6 pt-4 border-t border-aura-100">
                            <span class="text-sm font-semibold text-aura-900" x-text="formatPrice(product.price)"></span>
                            <button @click.stop="quickAddToCart(product)" class="bg-aura-900 text-white px-4 py-2 text-xs uppercase tracking-wider rounded-sm hover:bg-coffee transition-colors" x-text="t.addToCart"></button>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- 結帳頁面 (Checkout View) -->
        <div x-show="currentView === 'checkout'" x-transition.opacity class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
            <div class="text-center mb-12">
                <h1 class="text-3xl font-light tracking-wide font-serif" x-text="t.checkoutTitle"></h1>
                <p class="text-xs text-coffee uppercase tracking-widest mt-1 font-semibold" x-text="t.checkoutSubtitle"></p>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
                <!-- 收件資訊表單 -->
                <div class="lg:col-span-2 space-y-8">
                    <div class="bg-white p-6 border border-aura-200 rounded-sm shadow-sm">
                        <h2 class="text-sm font-semibold uppercase tracking-wider mb-4 flex items-center">
                            <span class="bg-coffee text-white w-6 h-6 rounded-full inline-flex items-center justify-center text-xs mr-2 font-bold">1</span>
                            <span x-text="t.shippingInfo"></span>
                        </h2>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs uppercase tracking-wider text-aura-800 mb-1" x-text="t.nameLabel"></label>
                                <input type="text" x-model="checkoutForm.name" :placeholder="t.namePlaceholder" class="w-full border border-aura-200 p-3 text-xs rounded-sm focus:outline-none focus:border-coffee">
                            </div>
                            <div>
                                <label class="block text-xs uppercase tracking-wider text-aura-800 mb-1" x-text="t.phoneLabel"></label>
                                <input type="text" x-model="checkoutForm.phone" placeholder="0912-345-678" class="w-full border border-aura-200 p-3 text-xs rounded-sm focus:outline-none focus:border-coffee">
                            </div>
                            <div class="sm:col-span-2">
                                <label class="block text-xs uppercase tracking-wider text-aura-800 mb-1" x-text="t.addressLabel"></label>
                                <input type="text" x-model="checkoutForm.address" :placeholder="t.addressPlaceholder" class="w-full border border-aura-200 p-3 text-xs rounded-sm focus:outline-none focus:border-coffee">
                            </div>
                            <div class="sm:col-span-2">
                                <label class="block text-xs uppercase tracking-wider text-aura-800 mb-1" x-text="t.notesLabel"></label>
                                <input type="text" x-model="checkoutForm.notes" :placeholder="t.notesPlaceholder" class="w-full border border-aura-200 p-3 text-xs rounded-sm focus:outline-none focus:border-coffee">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 訂單摘要與送出按鈕 -->
                <div class="bg-white p-6 border border-aura-200 rounded-sm shadow-sm h-fit">
                    <h2 class="text-sm font-semibold uppercase tracking-wider mb-4 pb-3 border-b border-aura-200 font-serif" x-text="t.orderSummary"></h2>
                    <div class="space-y-2 border-t border-aura-200 pt-4 text-xs mb-6">
                        <div class="flex justify-between text-sm font-semibold text-aura-900 pt-2 border-t border-aura-200">
                            <span x-text="t.grandTotal"></span>
                            <span x-text="formatPrice(cartTotal)"></span>
                        </div>
                    </div>

                    <!-- 觸發 GAS 通知與訂單送出 -->
                    <button @click="completeOrder()" :disabled="isSubmitting" class="w-full bg-aura-900 text-white py-3.5 text-xs uppercase tracking-widest font-semibold rounded-sm hover:bg-coffee transition-colors shadow-md disabled:opacity-50">
                        <span x-text="isSubmitting ? t.submitting : t.submitOrder"></span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const i18n = {
            zh: {
                topBanner: "全館滿 VND 800,000 即享免運優惠 · 職人精選單品豆新鮮烘焙中",
                navHome: "首頁", navShop: "所有商品", navBeans: "單品莊園豆", navDrip: "浸泡式咖啡袋", navEquipment: "器具周邊",
                searchTitle: "搜尋", accountTitle: "會員", cartTitle: "購物車",
                heroSubtitle: "Crafting Moments, One Sip at a Time",
                heroTitle: "探索純粹的<br><span class=\"font-semibold italic\">咖啡靈魂</span>",
                heroDesc: "嚴選全球微批次莊園咖啡豆，以精準烘焙曲線勾勒出每一款豆子獨一無二的風味風土。",
                btnShopNow: "立即選購", btnExploreDrip: "探索浸泡式咖啡",
                catalogTitle: "咖啡選物目錄", catAll: "所有分類", catBeans: "單品莊園豆", catDrip: "浸泡式咖啡袋", catEquip: "器具周邊",
                addToCart: "加入購物車", checkoutTitle: "安全結帳頁面", checkoutSubtitle: "Secure Checkout Protocol",
                shippingInfo: "收件人資訊", nameLabel: "姓名", namePlaceholder: "王小明", phoneLabel: "手機號碼",
                addressLabel: "收件地址", addressPlaceholder: "胡志明市第一郡...", notesLabel: "訂單備註 (選填)", notesPlaceholder: "例如：管理室代收",
                orderSummary: "訂單摘要細節", grandTotal: "總計金額", submitting: "訂單處理與通知中...", submitOrder: "確認送出訂單",
            },
            vi: {
                topBanner: "Miễn phí vận chuyển cho đơn hàng từ VND 800,000",
                navHome: "Trang chủ", navShop: "Sản phẩm", navBeans: "Hạt", navDrip: "Túi ngâm", navEquipment: "Dụng cụ",
                searchTitle: "Tìm", accountTitle: "Tài khoản", cartTitle: "Giỏ hàng",
                heroSubtitle: "Crafting Moments, One Sip at a Time",
                heroTitle: "Khám phá hương vị<br><span class=\"font-semibold italic\">Cà phê thuần túy</span>",
                heroDesc: "Tuyển chọn hạt cà phê từ các nông trại vi mô trên toàn thế giới.",
                btnShopNow: "Mua sắm", btnExploreDrip: "Túi ngâm",
                catalogTitle: "Danh mục", catAll: "Tất cả", catBeans: "Hạt", catDrip: "Túi ngâm", catEquip: "Dụng cụ",
                addToCart: "Thêm vào giỏ", checkoutTitle: "Thanh toán", checkoutSubtitle: "Secure Checkout Protocol",
                shippingInfo: "Thông tin nhận hàng", nameLabel: "Họ tên", namePlaceholder: "Nguyễn Văn A", phoneLabel: "Số điện thoại",
                addressLabel: "Địa chỉ", addressPlaceholder: "Quận 1, TP. Hồ Chí Minh...", notesLabel: "Ghi chú", notesPlaceholder: "Ghi chú...",
                orderSummary: "Chi tiết", grandTotal: "Tổng cộng", submitting: "Đang xử lý & gửi thông báo...", submitOrder: "Xác nhận đặt hàng",
            }
        };

        function phoenixCoffeeApp() {
            return {
                currentView: 'home',
                filterCategory: 'all',
                isSubmitting: false,
                lang: 'zh',
                checkoutForm: { name: '', phone: '', address: '', notes: '', payment: 'vcb' },
                cart: [{ id: 1, name: '100% 精品阿拉比卡咖啡豆 (250g)', nameVi: 'Cà phê Arabica (250g)', price: 145000, quantity: 1, image: 'https://placehold.co/600x800' }],
                products: [{ id: 1, name: '100% 精品阿拉比卡咖啡豆 (250g)', nameVi: 'Cà phê Arabica (250g)', category: 'beans', price: 145000, image: 'https://placehold.co/600x800' }],
                
                get t() { return i18n[this.lang]; },
                get filteredProducts() { return this.filterCategory === 'all' ? this.products : this.products.filter(p => p.category === this.filterCategory); },
                get cartTotal() { return this.cart.reduce((s, i) => s + (i.price * i.quantity), 0); },
                
                getProductName(p) { return this.lang === 'zh' ? p.name : p.nameVi; },
                formatPrice(p) { return 'VND ' + p.toLocaleString(); },
                openProductDetail(p) { this.currentView = 'detail'; },
                quickAddToCart(p) { this.currentView = 'checkout'; },

                // [核心新增] 自動觸發 Google Apps Script 傳送通知與紀錄
                async completeOrder() {
                    if (!this.checkoutForm.name || !this.checkoutForm.phone || !this.checkoutForm.address) {
                        alert(this.lang === 'zh' ? '請完整填寫收件人姓名、電話與地址！' : 'Vui lòng điền đầy đủ tên, số điện thoại và địa chỉ!');
                        return;
                    }
                    
                    this.isSubmitting = true;

                    // ⚠️ 請替換為您的 Google Apps Script 部署網址
                    const GAS_URL = "YOUR_GAS_WEB_APP_URL";

                    try {
                        const orderData = {
                            form: this.checkoutForm,
                            cart: this.cart,
                            total: this.cartTotal
                        };

                        // 透過 fetch 發送 POST 請求至 GAS
                        await fetch(GAS_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(orderData)
                        });

                        setTimeout(() => {
                            this.isSubmitting = false;
                            alert(this.lang === 'zh' ? '訂單已成功送出！已同步寫入試算表並發送通知。' : 'Đặt hàng thành công!');
                            this.cart = [];
                            this.currentView = 'home';
                        }, 1000);

                    } catch (error) {
                        console.error('GAS Error:', error);
                        this.isSubmitting = false;
                        alert(this.lang === 'zh' ? '網路連線異常，請稍後再試。' : 'Lỗi kết nối.');
                    }
                }
            }
        }
    </script>
</body>
</html>
